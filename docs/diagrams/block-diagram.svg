<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">JEN Academia System Block Diagram</title>
  <desc id="description">High-level architecture showing users, the React frontend, Express API, MySQL database, file storage, and optional external services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52708f"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52677b; }
      .group { fill: #f7faff; stroke: #b7c9dc; stroke-width: 2; }
      .group-title { font-size: 19px; font-weight: 700; }
      .box { fill: #eaf3ff; stroke: #5980a8; stroke-width: 2; }
      .store { fill: #edf8f1; stroke: #5b9871; stroke-width: 2; }
      .external { fill: #fff7e8; stroke: #be9450; stroke-width: 2; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 14px; fill: #42586c; }
      .edge { stroke: #52708f; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .edge-both { stroke: #52708f; stroke-width: 2.5; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { font-size: 13px; fill: #42586c; }
      .optional { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text class="title" x="48" y="52">JEN Academia — System Block Diagram</text>
  <text class="subtitle" x="48" y="80">High-level application architecture</text>

  <rect class="group" x="225" y="125" width="340" height="500" rx="18"/>
  <text class="group-title" x="250" y="160">Client</text>
  <rect class="box" x="270" y="235" width="250" height="100" rx="12"/>
  <text class="label" x="395" y="275" text-anchor="middle">React web frontend</text>
  <text class="small" x="395" y="302" text-anchor="middle">Pages, dashboards, and UI</text>
  <rect class="box" x="270" y="405" width="250" height="100" rx="12"/>
  <text class="label" x="395" y="445" text-anchor="middle">Browser session state</text>
  <text class="small" x="395" y="472" text-anchor="middle">User details and auth token</text>
  <path class="edge-both" d="M395 335 V405"/>

  <rect class="group" x="620" y="125" width="420" height="500" rx="18"/>
  <text class="group-title" x="645" y="160">Application server</text>
  <rect class="box" x="670" y="205" width="320" height="75" rx="12"/>
  <text class="label" x="830" y="237" text-anchor="middle">Express API</text>
  <text class="small" x="830" y="260" text-anchor="middle">REST requests and server events</text>
  <rect class="box" x="670" y="325" width="320" height="78" rx="12"/>
  <text class="label" x="830" y="357" text-anchor="middle">Security and validation</text>
  <text class="small" x="830" y="381" text-anchor="middle">Auth, roles, rate limits, file checks</text>
  <rect class="box" x="670" y="448" width="320" height="105" rx="12"/>
  <text class="label" x="830" y="483" text-anchor="middle">Application features</text>
  <text class="small" x="830" y="510" text-anchor="middle">Accounts, classes, booking, learning, admin</text>
  <path class="edge" d="M830 280 V325"/>
  <path class="edge" d="M830 403 V448"/>

  <rect class="box" x="42" y="220" width="145" height="68" rx="12"/>
  <text class="label" x="114" y="261" text-anchor="middle">Student</text>
  <rect class="box" x="42" y="350" width="145" height="68" rx="12"/>
  <text class="label" x="114" y="391" text-anchor="middle">Teacher</text>
  <rect class="box" x="42" y="480" width="145" height="68" rx="12"/>
  <text class="label" x="114" y="521" text-anchor="middle">Administrator</text>
  <path class="edge" d="M187 254 H270"/>
  <path class="edge" d="M187 384 H230 V285 H270"/>
  <path class="edge" d="M187 514 H245 V315 H270"/>

  <ellipse class="store" cx="1195" cy="242" rx="142" ry="64"/>
  <text class="label" x="1195" y="237" text-anchor="middle">MySQL database</text>
  <text class="small" x="1195" y="263" text-anchor="middle">Accounts and application records</text>
  <rect class="store" x="1053" y="380" width="284" height="95" rx="14"/>
  <text class="label" x="1195" y="420" text-anchor="middle">Server file storage</text>
  <text class="small" x="1195" y="446" text-anchor="middle">Uploads and recordings</text>
  <rect class="external" x="1053" y="525" width="284" height="100" rx="14"/>
  <text class="label" x="1195" y="562" text-anchor="middle">Optional external services</text>
  <text class="small" x="1195" y="588" text-anchor="middle">Email, SMS, LINE, Drive, AI, Turnstile</text>
  <path class="edge-both" d="M990 485 H1030 V242 H1053"/>
  <path class="edge-both" d="M990 500 H1018 V427 H1053"/>
  <path class="edge optional" d="M990 520 H1030 V575 H1053"/>

  <path class="edge-both" d="M520 270 H670"/>
  <text class="edge-label" x="595" y="255" text-anchor="middle">HTTPS</text>
  <text class="edge-label" x="595" y="290" text-anchor="middle">requests / responses</text>
  <text class="subtitle" x="48" y="700">External integrations are used only where configured.</text>
</svg>
